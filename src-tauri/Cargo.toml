[package]
name = "denizsigner"
version = "0.1.0"
description = "DenizSigner - Private iOS Sideloading & Signing Tool"
authors = ["Deniz Budakli"]
edition = "2024"

[lib]
name = "denizsigner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# NOTE: no tauri "devtools" feature in release builds (smaller surface).
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
idevice = { version = "0.1.57", features = ["usbmuxd", "house_arrest", "afc", "core_device_proxy", "remote_pairing", "tcp", "tunnel_tcp_stack", "xpc", "rsd", "pair"] }
isideload = { version = "0.4.0", features = ["fs-storage"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native"] }
futures = "0.3.31"
once_cell = "1.21.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
tracing-subscriber = "0.3"
tracing = "0.1"
tracing-appender = "0.2"
rustls = "0.23"
plist = "1"
plist-macro = "0.1.6"
tokio-util = "0.7"
thiserror = "2"
rootcause = "0.12"
url = "2"
zip = "2"
zeroize = "1"
strum = { version = "0.26", features = ["derive"] }
