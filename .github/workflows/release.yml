name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release-windows:
    name: Release (Windows x64)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install frontend dependencies
        run: npm ci
      - name: Build + publish draft release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DenizSigner ${{ github.ref_name }}"
          releaseBody: |
            Private iOS Sideloading & Signing Tool (Windows x64).

            Install `DenizSigner_<version>_x64-setup.exe` (NSIS) or
            `DenizSigner_<version>_x64_en-US.msi`. `denizsigner.exe` runs portable.

            Only download from this official release page.

            Local-first: no accounts, no analytics, no telemetry.
            See PRIVACY.md for the documented network allowlist.
          releaseDraft: false
          prerelease: false
          uploadPlainBinary: true
          args: --bundles nsis,msi
