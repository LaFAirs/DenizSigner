name: Linux
on:
  push:
    branches: [main, 'codex/linux-*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish an installable Linux prerelease
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev libdbus-1-dev librsvg2-dev
      - run: npm ci && npm run build && npm test && npm audit
      - run: cargo test --release --locked
        working-directory: src-tauri
      - run: cargo build --release --features custom-protocol --locked
        working-directory: src-tauri
      - run: scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: DenizSigner-linux-x86_64
          path: releases/*
      - name: Publish Linux prerelease
        if: (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && github.ref == 'refs/heads/codex/linux-credential-manager')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="linux-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          gh release create "$tag" releases/* --target "$GITHUB_SHA" --prerelease --title "DenizSigner Linux $tag" --notes-file docs/LINUX.md
