name: Bug report
description: Something is broken in DenizSigner
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: DenizSigner version
      placeholder: e.g. v0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [Windows 11, Windows 10, macOS, Linux]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (Settings → View Logs)
      description: Remove any personal data before pasting. Never paste passwords, 2FA codes, or tokens.
      render: text
